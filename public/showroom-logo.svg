<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D2481B"/>
      <stop offset="100%" stop-color="#9E2E0A"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24211D"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Shield / Emblem -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#shieldGrad)" stroke="#3A362F" stroke-width="3"/>
  <rect x="7" y="7" width="86" height="86" rx="17" fill="none" stroke="#D2481B" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Stylized Automotive Silhouette -->
  <g transform="translate(18, 22)">
    <!-- Cabin & Body -->
    <path d="M 4 28 L 12 14 Q 15 10 24 10 L 40 10 Q 48 10 52 14 L 60 28 Z" fill="url(#primaryGrad)"/>
    <path d="M 2 28 L 62 28 Q 64 28 64 32 L 64 36 Q 64 38 60 38 L 4 38 Q 0 38 0 34 L 0 30 Q 0 28 2 28 Z" fill="#F3EFE6"/>
    <!-- Windows -->
    <path d="M 16 25 L 20 15 Q 22 13 27 13 L 31 13 L 31 25 Z" fill="#191714"/>
    <path d="M 35 25 L 35 13 L 42 13 Q 46 13 48 15 L 51 25 Z" fill="#191714"/>
    <!-- Wheels -->
    <circle cx="15" cy="38" r="6.5" fill="#191714" stroke="#D2481B" stroke-width="2.5"/>
    <circle cx="15" cy="38" r="2" fill="#F3EFE6"/>
    <circle cx="49" cy="38" r="6.5" fill="#191714" stroke="#D2481B" stroke-width="2.5"/>
    <circle cx="49" cy="38" r="2" fill="#F3EFE6"/>
    <!-- Headlights -->
    <circle cx="61" cy="32" r="2" fill="#E8A58A"/>
  </g>
  
  <!-- Bottom Text: ERP -->
  <text x="50" y="82" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#F3EFE6" text-anchor="middle" letter-spacing="4">SHOWROOM</text>
  <text x="50" y="92" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="800" fill="#D2481B" text-anchor="middle" letter-spacing="2.5">ERP SYSTEM</text>
</svg>

